# Feeds, Gewichte und Ressort. Geprueft am 2026-10-06 (tools/probe_feeds.py).
# weight: 0.5 (Randquelle) bis 1.5 (Leitquelle), geht als Hinweis in Lauf 1.
# paywall: true = Feed liefert nur Teaser, daraus keine Details ableiten.
# window_hours: optional, ueberschreibt das Standardfenster von 24h.
defaults:
  window_hours: 24
  max_items_per_source: 25
  teaser_chars: 700

